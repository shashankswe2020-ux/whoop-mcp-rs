[package]
name = "whoop-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only WHOOP MCP server for recovery, sleep, HRV, strain, workouts, and personal health analytics in AI assistants (Rust port of whoop-ai-mcp)"
license = "MIT"
authors = ["Shashank Mishra"]
repository = "https://github.com/shashankswe2020-ux/whoop-mcp-rs"
homepage = "https://shashankswe2020-ux.github.io/whoop-mcp/"
documentation = "https://docs.rs/whoop-mcp"
readme = "README.md"
keywords = ["whoop", "mcp", "model-context-protocol", "health", "fitness"]
categories = ["command-line-utilities", "api-bindings"]
include = ["src/**", "assets/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "whoop-mcp"
path = "src/main.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.47", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
